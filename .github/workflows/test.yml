name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS treats both Unicode forms of a file name as one file and Linux keeps them apart,
        # so the handling of names a sync tool rewrote (NFC and NFD) is tested on both.
        os: [ubuntu-latest, macos-latest, windows-latest]
        # The records live in node:sqlite, which Node 22.16 and later carry without a flag.
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # The tests commit to throwaway workspaces.
      - run: git config --global user.name CI && git config --global user.email ci@example.invalid
      - run: npm ci
      - run: npm test
      # The release checker launches POSIX npm executables; the Windows job covers the engine tests.
      - run: npm run release:check -- --quick
        if: runner.os != 'Windows'

  pack:
    name: Install from a packed tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: git config --global user.name CI && git config --global user.email ci@example.invalid
      # A packed install is the only check that `files` ships everything the CLI and skills need.
      - run: npm pack
      - name: Create a workspace with the packed engine
        run: |
          tarball="$PWD/$(ls excudo-*.tgz)"
          dir="$(mktemp -d)"
          cd "$dir"
          npm init -y > /dev/null
          npm install "$tarball"
          npx --no-install excudo init memo --example
          cd memo
          npm install "$tarball"
          npx --no-install excudo check
          npx --no-install excudo build
          test -L .claude/skills/excudo-distill
          # The copied skills find the engine's skill kit through this workspace's node_modules.
          npx --no-install excudo skills lint excudo-capture
          node .agents/skills/excudo-capture/scripts/check.mjs --self-test > /dev/null
          node .agents/skills/excudo-recall/scripts/check.mjs
